name: Build Windows Installer

on:
  push:
    branches: [ master, au/serene-wozniak-reg4pr ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      BUILD_DIR: C:\csb
    steps:
      - name: Checkout CubicSDR
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout WinBuild scripts
        uses: actions/checkout@v4
        with:
          repository: dtba3a-del/CubicSDR-WinBuild
          ref: main
          path: winbuild

      - name: Prepare build tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:BUILD_DIR\build-x64-Release\sources" -Force | Out-Null
          Copy-Item -Recurse -Path winbuild\build.ps1, winbuild\scripts -Destination $env:BUILD_DIR
          Copy-Item -Recurse -Path src -Destination "$env:BUILD_DIR\build-x64-Release\sources\CubicSDR"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install SDRplay API headers/libs (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          $ok = $false
          foreach ($v in "3.15", "3.14") {
            try {
              Invoke-WebRequest -UserAgent $ua "https://www.sdrplay.com/software/SDRplay_RSP_API-Windows-$v.exe" -OutFile "$env:RUNNER_TEMP\sdrplay.exe"
              $ok = $true; break
            } catch { Write-Host "SDRplay API $v download failed: $_" }
          }
          if (-not $ok) { Write-Host "::warning::SDRplay API unavailable, SoapySDRPlay3 module will be skipped"; exit 1 }
          7z x -o"C:\Program Files\SDRplay\" "$env:RUNNER_TEMP\sdrplay.exe" API/inc/* API/x64/* API/x86/*

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build
        shell: powershell
        working-directory: C:\csb
        run: |
          python -m pip install mako
          . .\build.ps1 Release x64

      - name: Collect installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "$env:BUILD_DIR\build-x64-Release\target\CubicSDR" -Filter "CubicSDR-*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "Installer not found"; exit 1 }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $exe.FullName dist/

      - uses: actions/upload-artifact@v4
        with:
          name: CubicSDR-Windows-x64
          path: dist/*.exe

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: CubicSDR Windows x64 build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Automated Windows x64 installer build (scripts: dtba3a-del/CubicSDR-WinBuild).
            Source commit: ${{ github.sha }}
          files: dist/*.exe
